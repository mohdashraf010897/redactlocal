[package]
name = "redactlocal"
version = "1.0.0"
description = "RedactLocal — 100% Offline, Privacy-First PDF Redaction & 7-Oracle Verifier"
authors = ["RedactLocal Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
